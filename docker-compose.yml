services:
  energy-dashboard:
    build: .
    container_name: energy-dashboard
    restart: unless-stopped
    ports:
      - "3030:3000"
    # SQLite lives on the host so rebuilding the container keeps your history.
    # On Unraid, deploy from /mnt/user/appdata/energy-dashboard so this is
    # /mnt/user/appdata/energy-dashboard/data.
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Chicago
    env_file: .env
